<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.50; transform: scale(1.06); }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .ambient-glow {
        transform-origin: center;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .cursor {
        animation: blinkCursor 1s step-end infinite;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="1.5" y="1.5" width="957" height="237" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Ambient Glow Effects -->
  <circle cx="160" cy="120" r="130" fill="#4f46e5" filter="blur(60px)" opacity="0.3" class="ambient-glow" />
  <circle cx="820" cy="80" r="110" fill="#0284c7" filter="blur(55px)" opacity="0.25" class="ambient-glow" />

  <!-- ==================== LEFT COLUMN (Width: 460px) ==================== -->
  <g transform="translate(44, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 26)">
      <rect width="210" height="22" rx="11" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <circle cx="11" cy="11" r="3.5" fill="#10b981" />
      <text x="22" y="15" fill="#c7d2fe" font-size="10.5" font-weight="700" letter-spacing="0.06em" class="font-sans">v0.3.0-BETA • DEVELOPER PREVIEW</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="86" fill="url(#title-grad)" font-size="36" font-weight="900" letter-spacing="-0.02em" class="font-sans">Criation UI</text>

    <!-- Subtitles (Separated cleanly, zero overlap) -->
    <text x="0" y="116" fill="#94a3b8" font-size="14" font-weight="400" class="font-sans">Modular React 18+ component foundation and rapid workflows.</text>
    <text x="0" y="136" fill="#64748b" font-size="12.5" font-weight="400" class="font-sans">Canonical JSX first • Tree-shakable • Precompiled zero-runtime CSS</text>

    <!-- Terminal Command Snippet Box -->
    <g transform="translate(0, 156)">
      <rect width="450" height="46" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <!-- Window control dots -->
      <circle cx="16" cy="23" r="3.5" fill="#ef4444" />
      <circle cx="28" cy="23" r="3.5" fill="#f59e0b" />
      <circle cx="40" cy="23" r="3.5" fill="#10b981" />
      <!-- Shell Command -->
      <text x="56" y="27" font-size="12" class="font-mono">
        <tspan fill="#64748b">$ </tspan>
        <tspan fill="#38bdf8">npx </tspan>
        <tspan fill="#e2e8f0">@criation/ui init my-app </tspan>
        <tspan fill="#818cf8" class="cursor">_</tspan>
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN (Width: 360px) ==================== -->
  <g transform="translate(540, 26)">
    <!-- Metric Card 1: Verified Tests -->
    <g transform="translate(0, 0)">
      <rect width="376" height="52" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <rect width="4" height="52" rx="2" fill="#10b981" />
      <text x="18" y="21" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="0.08em" class="font-mono">VERIFIED AUTOMATED TEST SUITE</text>
      <text x="18" y="40" fill="#ffffff" font-size="13.5" font-weight="700" class="font-sans">142 / 142 Passing Specs (100% Pass Rate)</text>
    </g>

    <!-- Metric Card 2: Bundle Size -->
    <g transform="translate(0, 64)">
      <rect width="376" height="52" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <rect width="4" height="52" rx="2" fill="#38bdf8" />
      <text x="18" y="21" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="0.08em" class="font-mono">TREE-SHAKEABLE SUBPATH EXPORTS</text>
      <text x="18" y="40" fill="#ffffff" font-size="13.5" font-weight="700" class="font-sans">Button: 2.54 kB • Full CSS: 34.76 kB (6.8 kB gz)</text>
    </g>

    <!-- Metric Card 3: Accessibility & License -->
    <g transform="translate(0, 128)">
      <rect width="376" height="52" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <rect width="4" height="52" rx="2" fill="#818cf8" />
      <text x="18" y="21" fill="#94a3b8" font-size="10" font-weight="700" letter-spacing="0.08em" class="font-mono">STANDARDS &amp; LICENSING</text>
      <text x="18" y="40" fill="#ffffff" font-size="13.5" font-weight="700" class="font-sans">WCAG 2.2 AA Verified • MIT Open Source License</text>
    </g>
  </g>
</svg>
